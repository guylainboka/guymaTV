name: Build guymaTV APK

# Build the Android APK from the Next.js frontend via Capacitor.
#
# Trigger: push a tag like `v1.0.0` to GitHub, OR manually from the Actions tab.
# The workflow:
#   1. Builds the Next.js static export (frontend only, no API routes)
#   2. Wraps it with Capacitor into an Android project
#   3. Builds a debug (and/or release) APK with Gradle
#   4. Uploads the APK as a GitHub Actions artifact (downloadable)
#
# IMPORTANT: Set the following repository secrets before triggering:
#   GUYMA_API_BASE_URL — the deployed backend URL (e.g. https://guyma-api.onrender.com)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
          - both

env:
  NODE_VERSION: "22"
  BUN_VERSION: "1.3"
  JAVA_VERSION: "21"
  ANDROID_SDK_VERSION: "34"

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🤖 Setup Android SDK
        run: |
          # The ubuntu-latest runner already has Android SDK pre-installed.
          # We just need to accept licenses and install the required components.
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          
          # Accept all Android SDK licenses
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          
          # Install required SDK components
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          
          # Verify installation
          sdkmanager --list_installed 2>/dev/null | head -20 || sdkmanager --list 2>/dev/null | head -20
          echo "✅ Android SDK ready"

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔍 Determine build type
        id: buildtype
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "build_type=${{ inputs.build_type }}" >> $GITHUB_OUTPUT
          else
            echo "build_type=both" >> $GITHUB_OUTPUT
          fi

      - name: 🏗️ Build Next.js static export
        env:
          GUYMA_MOBILE_BUILD: "1"
          GUYMA_API_BASE_URL: ${{ secrets.GUYMA_API_BASE_URL }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.GUYMA_API_BASE_URL }}
        run: |
          # Temporarily exclude API routes (incompatible with output: export).
          mkdir -p .mobile-excluded
          mv src/app/api .mobile-excluded/api

          # Run the build (next.config.ts detects GUYMA_MOBILE_BUILD=1 → output: export)
          bun run build 2>&1 | tail -60

          # Restore API routes
          mv .mobile-excluded/api src/app/api
          rmdir .mobile-excluded 2>/dev/null || true

          # Verify export
          if [[ ! -f "mobile/www/index.html" ]]; then
            echo "❌ Build failed: mobile/www/index.html not found"
            exit 1
          fi

          # Inject runtime API base URL
          if [[ -n "$GUYMA_API_BASE_URL" ]]; then
            find mobile/www -name "*.html" -exec \
              sed -i "s|</head>|<script>window.__API_BASE_URL__=\"${GUYMA_API_BASE_URL}\";</script></head>|" {} \;
          fi

          echo "✅ Static export ready"
          ls -la mobile/www/ | head -20

      - name: 📱 Add Capacitor Android platform
        run: |
          bunx cap add android 2>/dev/null || true
          bunx cap sync android

      - name: 🔧 Configure Android for cleartext + WebView
        run: |
          # Android resources MUST be in res/xml/ (not just xml/)
          mkdir -p android/app/src/main/res/xml
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<network-security-config>' \
            '    <base-config cleartextTrafficPermitted="true">' \
            '        <trust-anchors>' \
            '            <certificates src="system" />' \
            '        </trust-anchors>' \
            '    </base-config>' \
            '</network-security-config>' \
            > android/app/src/main/res/xml/network_security_config.xml
          sed -i 's|<application|<application android:networkSecurityConfig="@xml/network_security_config"|' \
            android/app/src/main/AndroidManifest.xml
          echo "=== Verify file ==="
          cat android/app/src/main/res/xml/network_security_config.xml

      - name: 🔨 Build Debug APK
        if: steps.buildtype.outputs.build_type == 'debug' || steps.buildtype.outputs.build_type == 'both'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -x lintVitalAnalyzeRelease

      - name: 🔨 Build Release APK
        if: steps.buildtype.outputs.build_type == 'release' || steps.buildtype.outputs.build_type == 'both'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -x lintVitalAnalyzeRelease

      - name: 📤 Upload Debug APK
        if: steps.buildtype.outputs.build_type == 'debug' || steps.buildtype.outputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: guymaTV-debug-${{ github.ref_name || github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 📤 Upload Release APK
        if: steps.buildtype.outputs.build_type == 'release' || steps.buildtype.outputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: guymaTV-release-${{ github.ref_name || github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: 📊 Build Summary
        run: |
          echo "## 🎉 guymaTV APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build type:** ${{ steps.buildtype.outputs.build_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**API backend:** ${{ secrets.GUYMA_API_BASE_URL || '(not set — APK will use relative URLs)' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the workflow run artifacts section above." >> $GITHUB_STEP_SUMMARY
