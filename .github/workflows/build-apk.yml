name: Build guymaTV APK

# Build the Android APK from the Next.js frontend via Capacitor.
#
# Trigger: push a tag like `v1.0.0` to GitHub, OR manually from the Actions tab.
# The workflow:
#   1. Builds the Next.js static export (frontend only, no API routes)
#   2. Wraps it with Capacitor into an Android project
#   3. Builds a debug (and/or release) APK with Gradle
#   4. Uploads the APK as a GitHub Actions artifact (downloadable)
#
# IMPORTANT: Set the following repository secrets/variables before triggering:
#   Secrets:
#     GUYMA_API_BASE_URL  — the deployed backend URL (e.g. https://guyma-api.onrender.com)
#                           The APK will call this for /api/* requests.
#   (For release builds, also set:)
#     ANDROID_KEYSTORE_BASE64  — base64-encoded .keystore file
#     ANDROID_KEYSTORE_PASSWORD
#     ANDROID_KEY_ALIAS
#     ANDROID_KEY_PASSWORD

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
          - both

env:
  NODE_VERSION: "20"
  BUN_VERSION: "1.1"
  JAVA_VERSION: "17"
  ANDROID_SDK_VERSION: "33"

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}
          build-tools-version: "33.0.2"
          ndk-version: "25.2.9519653"

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔍 Determine build type
        id: buildtype
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "build_type=${{ inputs.build_type }}" >> $GITHUB_OUTPUT
          else
            # For tag pushes, build both debug + release
            echo "build_type=both" >> $GITHUB_OUTPUT
          fi

      - name: 🏗️ Build Next.js static export
        env:
          GUYMA_MOBILE_BUILD: "1"
          GUYMA_API_BASE_URL: ${{ secrets.GUYMA_API_BASE_URL }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.GUYMA_API_BASE_URL }}
        run: |
          # Temporarily exclude API routes (incompatible with output: export).
          # Move OUTSIDE src/app so Next doesn't see it as a route folder.
          if [[ -d "src/app/api" ]]; then
            mkdir -p .mobile-excluded
            mv src/app/api .mobile-excluded/api
          fi

          # Run the build
          bun run build 2>&1 | tail -50

          # Restore API routes
          if [[ -d ".mobile-excluded/api" ]]; then
            mv .mobile-excluded/api src/app/api
            rmdir .mobile-excluded 2>/dev/null || true
          fi

          # Verify export
          if [[ ! -f "mobile/www/index.html" ]]; then
            echo "❌ Build failed: mobile/www/index.html not found"
            exit 1
          fi

          # Inject runtime API base URL (allows re-pointing APK without rebuild)
          if [[ -n "$GUYMA_API_BASE_URL" ]]; then
            find mobile/www -name "*.html" -exec \
              sed -i "s|</head>|<script>window.__API_BASE_URL__=\"${GUYMA_API_BASE_URL}\";</script></head>|" {} \;
          fi

          echo "✅ Static export ready"
          ls -la mobile/www/ | head -20

      - name: 📱 Add Capacitor Android platform
        run: |
          bunx cap add android 2>/dev/null || true
          bunx cap sync android

      - name: 🔧 Configure Android for cleartext + WebView
        run: |
          # Allow cleartext HTTP (some video hosters don't use HTTPS)
          mkdir -p android/app/src/main/xml
          cat > android/app/src/main/xml/network_security_config.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          XML

          # Add the network security config to the AndroidManifest
          sed -i 's|<application|<application android:networkSecurityConfig="@xml/network_security_config"|' \
            android/app/src/main/AndroidManifest.xml

          # Ensure INTERNET permission
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml || \
            sed -i 's|<manifest|<manifest\n    xmlns:tools="http://schemas.android.com/tools"|' \
            android/app/src/main/AndroidManifest.xml

      - name: 🔨 Build Debug APK
        if: steps.buildtype.outputs.build_type == 'debug' || steps.buildtype.outputs.build_type == 'both'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -x lintVitalAnalyzeRelease

      - name: 🔨 Build Release APK
        if: steps.buildtype.outputs.build_type == 'release' || steps.buildtype.outputs.build_type == 'both'
        working-directory: android
        env:
          # Decode keystore if provided (for signed release builds)
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_FILE" ]]; then
            echo "$ANDROID_KEYSTORE_FILE" | base64 -d > android.keystore
            # Create keystore properties file
            cat > keystore.properties << 'PROPS'
            storeFile=android.keystore
            storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
            keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
            PROPS
          fi
          ./gradlew assembleRelease --no-daemon -x lintVitalAnalyzeRelease

      - name: 📤 Upload Debug APK
        if: steps.buildtype.outputs.build_type == 'debug' || steps.buildtype.outputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: guymaTV-debug-${{ github.ref_name || github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 📤 Upload Release APK
        if: steps.buildtype.outputs.build_type == 'release' || steps.buildtype.outputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: guymaTV-release-${{ github.ref_name || github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: 📊 Build Summary
        run: |
          echo "## 🎉 guymaTV APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build type:** ${{ steps.buildtype.outputs.build_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**API backend:** ${{ secrets.GUYMA_API_BASE_URL || '(not set — APK will use relative URLs)' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the workflow run artifacts section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Install" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the APK artifact" >> $GITHUB_STEP_SUMMARY
          echo "2. Transfer to your Android device" >> $GITHUB_STEP_SUMMARY
          echo "3. Enable 'Install from unknown sources'" >> $GITHUB_STEP_SUMMARY
          echo "4. Tap the APK to install" >> $GITHUB_STEP_SUMMARY
